name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Kirby ${{ matrix.kirby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        kirby: ['^4.0', '^5.0']

    # Real SFTP server for tests/ServerIntegrationTest.php (FTP runs in the job, see below)
    services:
      sftp:
        image: atmoz/sftp
        ports:
          - 2222:22
        env:
          SFTP_USERS: tester:testpass:1001::upload

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ftp, zip

      - name: Install dependencies
        run: composer update --no-progress --with "getkirby/cms:${{ matrix.kirby }}"

      - name: Start the FTP test server
        run: |
          pip install --quiet pyftpdlib
          mkdir -p /tmp/ftp-root
          nohup python -m pyftpdlib -p 2121 -w -u ftptester -P ftppass -d /tmp/ftp-root > /tmp/ftp.log 2>&1 &

      # Service containers start without a health check; wait until both servers answer
      - name: Wait for the test servers
        run: |
          for i in $(seq 1 45); do
            ftp=no; sftp=no
            curl -s --max-time 3 ftp://ftptester:ftppass@127.0.0.1:2121/ >/dev/null && ftp=yes
            ssh-keyscan -p 2222 -T 3 127.0.0.1 2>/dev/null | grep -q ssh && sftp=yes
            [ "$ftp$sftp" = "yesyes" ] && exit 0
            sleep 2
          done
          echo "Test servers did not become ready (ftp: $ftp, sftp: $sftp)"
          cat /tmp/ftp.log
          exit 1

      - name: Run test suite
        run: composer test
        env:
          FTP_BACKUP_TEST_FTP: ftp://ftptester:ftppass@127.0.0.1:2121/
          FTP_BACKUP_TEST_SFTP: sftp://tester:testpass@127.0.0.1:2222/upload
          FTP_BACKUP_TEST_SFTP_RELATIVE: upload

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ftp, zip

      # The release workflow bumps "version" in composer.json, which always outdates the lock hash
      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run phpstan
        run: composer analyze
